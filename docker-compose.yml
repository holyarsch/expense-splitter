services:
  db:
    image: postgres:16-alpine
    container_name: expense-splitter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: expense_pass
      POSTGRES_DB: expense_splitter
    volumes:
      - expense_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_user -d expense_splitter"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: expense-splitter-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://expense_user:expense_pass@db:5432/expense_splitter?schema=public"
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string}
      JWT_EXPIRES_IN: "7d"
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      COOKIE_NAME: expense_token
      COOKIE_SECURE: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Expense Splitter <no-reply@example.com>}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
    container_name: expense-splitter-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  expense_db_data:
